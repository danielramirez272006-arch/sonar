<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" fill="none">
  <defs>
    <!-- Top Petal Gradient (Crimson) -->
    <radialGradient id="topPetal" cx="50%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#9E1B29" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#4A0E18" stop-opacity="0.8" />
    </radialGradient>
    
    <!-- Left Petal Gradient (Brand Red) -->
    <radialGradient id="leftPetal" cx="35%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#C51613" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#6B0907" stop-opacity="0.8" />
    </radialGradient>
    
    <!-- Bottom Petal Gradient (Dark Petrol/Navy) -->
    <radialGradient id="bottomPetal" cx="50%" cy="65%" r="65%">
      <stop offset="0%" stop-color="#1B324B" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0E1A29" stop-opacity="0.85" />
    </radialGradient>
    
    <!-- Right Petal Gradient (Deep Purple/Plum) -->
    <radialGradient id="rightPetal" cx="65%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#4B2A5E" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#231130" stop-opacity="0.85" />
    </radialGradient>
  </defs>

  <!-- 4 Overlapping Circular Petals -->
  <g>
    <!-- Top Circle -->
    <circle cx="60" cy="38" r="27" fill="url(#topPetal)" />
    <!-- Left Circle -->
    <circle cx="38" cy="60" r="27" fill="url(#leftPetal)" />
    <!-- Bottom Circle -->
    <circle cx="60" cy="82" r="27" fill="url(#bottomPetal)" />
    <!-- Right Circle -->
    <circle cx="82" cy="60" r="27" fill="url(#rightPetal)" />
  </g>

  <!-- Concentric Radar Rings -->
  <!-- Outer dashed radar ring passing through petal centers -->
  <circle cx="60" cy="60" r="37" stroke="rgba(255, 255, 255, 0.45)" stroke-width="1.2" stroke-dasharray="3.5 3.5" fill="none" />
  
  <!-- Middle solid radar ring -->
  <circle cx="60" cy="60" r="21" stroke="rgba(255, 255, 255, 0.55)" stroke-width="1" fill="none" />

  <!-- Center Target Elements -->
  <!-- Dark ring base -->
  <circle cx="60" cy="60" r="11" fill="#1C0D1C" stroke="rgba(255, 255, 255, 0.25)" stroke-width="1" />
  
  <!-- Red Sonar Core -->
  <circle cx="60" cy="60" r="7.5" fill="#B80C09" />
  
  <!-- Center White Target Point -->
  <circle cx="60" cy="60" r="2.8" fill="#ffffff" />
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" fill="none">
  <defs>
    <!-- Top Petal Gradient -->
    <radialGradient id="topPetal" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#8a1320" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#4a0f1e" stop-opacity="0.85" />
    </radialGradient>
    
    <!-- Left Petal Gradient -->
    <radialGradient id="leftPetal" cx="40%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#B80C09" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#540807" stop-opacity="0.85" />
    </radialGradient>
    
    <!-- Bottom Petal Gradient -->
    <radialGradient id="bottomPetal" cx="50%" cy="60%" r="50%">
      <stop offset="0%" stop-color="#1B2838" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#0f1722" stop-opacity="0.85" />
    </radialGradient>
    
    <!-- Right Petal Gradient -->
    <radialGradient id="rightPetal" cx="60%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3F2B55" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#231730" stop-opacity="0.85" />
    </radialGradient>
  </defs>

  <!-- 4 Overlapping Circular Petals -->
  <g style="mix-blend-mode: screen;">
    <!-- Top Circle -->
    <circle cx="60" cy="40" r="28" fill="url(#topPetal)" />
    <!-- Left Circle -->
    <circle cx="40" cy="60" r="28" fill="url(#leftPetal)" />
    <!-- Bottom Circle -->
    <circle cx="60" cy="80" r="28" fill="url(#bottomPetal)" />
    <!-- Right Circle -->
    <circle cx="80" cy="60" r="28" fill="url(#rightPetal)" />
  </g>

  <!-- Concentric Sonar Radar Rings -->
  <!-- Outer dashed radar ring -->
  <circle cx="60" cy="60" r="38" stroke="#ffffff" stroke-opacity="0.3" stroke-width="1.2" stroke-dasharray="3.5 3.5" fill="none" />
  
  <!-- Middle solid radar ring -->
  <circle cx="60" cy="60" r="22" stroke="#ffffff" stroke-opacity="0.45" stroke-width="1" fill="none" />

  <!-- Center Target Elements -->
  <!-- Dark ring base -->
  <circle cx="60" cy="60" r="11" fill="#231123" stroke="rgba(255, 255, 255, 0.15)" stroke-width="1" />
  
  <!-- Red Sonar Core -->
  <circle cx="60" cy="60" r="7.5" fill="#B80C09" />
  
  <!-- Center White Target Point -->
  <circle cx="60" cy="60" r="3" fill="#ffffff" />
</svg>
